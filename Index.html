<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Repository</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .repo-card {
            background: white;
            width: 350px;
            margin: auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 8px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
        }

        p {
            color: #666;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            background: #24292e;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
        }

        a:hover {
            background: #0366d6;
        }
    </style>
</head>
<body>

    <div class="repo-card">
        <h1>My GitHub Repository</h1>
        <h1>Welcome to Mudassir Magic</h1>
        <p>This is a simple HTML page for a GitHub repository.</p>

        <a href="https://github.com/your-username/your-repository" target="_blank">
            View Repository
        </a>
    </div>

</body>
</html>
